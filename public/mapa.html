<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>WiFiMex &middot; Mapa Mikrotiks</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/wifimex-network-mark.svg?v=20260724">
  <style>
    :root{--sidebar-open:316px;--sidebar-closed:92px}
    html,body{min-height:100%;margin:0}
    body.sidebar-collapsed{display:block;padding-left:var(--sidebar-closed);overflow-x:hidden;background:#eef5fb}
    body:not(.sidebar-collapsed){display:block;padding-left:var(--sidebar-open);overflow-x:hidden;background:#eef5fb}
    .topbar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-closed);height:100vh;height:100dvh;z-index:5000;margin:0;background:#082f50;overflow:hidden;transform:none;transition:none;animation:none}
    body:not(.sidebar-collapsed) .topbar{width:var(--sidebar-open)}
    .page-shell{box-sizing:border-box;width:100%;margin:0;padding:8px 12px 10px;transition:none;transform:none}
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20260902-evidence-viewer-v1">
  <link rel="stylesheet" href="assets/css/sidebar-compact.css?v=20260830-responsive-colors-v3">
  <link rel="stylesheet" href="assets/css/map-toolbar-compact.css?v=20261123-compact-dedupe-v1">
  <link rel="stylesheet" href="assets/css/map-responsive.css?v=20261123-compact-dedupe-v1">
  <script>try{document.documentElement.dataset.role=(JSON.parse(localStorage.getItem('user')||'{}').role||'').toLowerCase()}catch(e){}</script>
</head>
<body class="map-page">
  <script>if(localStorage.getItem('netops_menu_open_v3')==='0')document.body.classList.add('sidebar-collapsed')</script>
  <div class="topbar">
    <a href="mapa.html" class="logo-link"><div class="logo">WiFi<span>Mex</span></div></a>
    <nav class="nav">
      <a href="mapa.html" class="nb active">Mapa Mikrotiks</a>
      <a href="antenas.html" class="nb">Antenas</a>
      <a href="nodos.html" class="nb">Pueblos</a>
      <a href="planificar.html" class="nb">Planificar</a>
      <a href="ordenes.html?detailKind=network" class="nb">Detalles de red</a>
      <a href="ordenes.html?detailKind=physical" class="nb">Detalles físicos</a>
      <a href="material.html" class="nb">Material</a>
      <a href="tecnicos.html" class="nb">Usuarios</a>
    </nav>
    <div class="sbar"><div class="user-pill" data-user-name>Sesion activa</div><button class="btn bgh" onclick="logout()">Cerrar sesion</button></div>
  </div>

  <div class="page-shell wide-shell map-page-shell">
    <section class="content-card map-card map-main-card" id="map-card">
      <header class="map-toolbar map-unified-bar" aria-label="Encabezado y filtros del mapa">
        <div class="map-bar-brand">
          <span class="map-bar-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.6"/></svg></span>
          <h1 class="map-bar-title">Mapa general</h1>
          <div class="map-bar-stats" aria-label="Resumen de sitios">
            <span class="map-kpi-pill map-stat-equipment" title="Antenas registradas"><i class="map-kpi-dot"></i><span class="map-kpi-label">Antenas</span><strong id="map-stat-equipment">0</strong></span>
            <span class="map-kpi-pill map-stat-nodes" title="Pueblos registrados"><i class="map-kpi-dot"></i><span class="map-kpi-label">Pueblos</span><strong id="map-stat-nodes">0</strong></span>
            <span class="map-kpi-pill map-stat-visible" title="Elementos visibles en el mapa"><i class="map-kpi-dot"></i><span class="map-kpi-label">Visibles</span><strong id="map-stat-visible">0</strong></span>
            <span class="map-kpi-pill map-stat-critical" title="Sitios críticos"><i class="map-kpi-dot"></i><span class="map-kpi-label">Críticos</span><strong id="map-stat-critical">0</strong></span>
          </div>
        </div>
        <span class="map-bar-divider" aria-hidden="true"></span>
        <div class="map-toolbar-row">
          <select id="map-view-filter" onchange="updateMapMarkers()" class="search-input" data-map-admin-only aria-label="Filtrar tipo de marcador"><option value="both">Ver ambos</option><option value="equipment">Solo Mikrotiks</option><option value="nodes">Solo nodos</option></select>
          <select id="map-zone-filter" onchange="updateMapMarkers()" class="search-input" aria-label="Filtrar por zona"></select>
          <input id="map-search" list="map-search-options" class="search-input" placeholder="Buscar antena, IP, nodo o pueblo..." oninput="debounceAction('map-search', updateMapMarkers, 160)" aria-label="Buscar en el mapa"><datalist id="map-search-options"></datalist>
          <label class="inline-pill map-label-toggle"><input type="checkbox" id="map-show-labels" onchange="updateMapMarkers()"> <span id="map-label-text">Nombres</span></label>
          <label class="inline-pill map-links-toggle" data-map-admin-only style="display:none"><input type="checkbox" id="map-show-links" checked onchange="updateMapMarkers()"> Uniones</label>
          <button class="btn bo2 map-icon-button map-center-button" onclick="centerDefaultMap()" title="Centrar mapa" aria-label="Centrar mapa"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
          <button class="btn bc map-expand-button map-icon-button" onclick="toggleMapFullscreen()" title="Agrandar mapa" aria-label="Agrandar mapa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/></svg></button>
        </div>
      </header>
      <div id="map"></div>
      <section class="content-card small-help map-color-help">
      <strong>Estado:</strong><span><i class="map-color-dot critical"></i> Crítico</span><span><i class="map-color-dot high"></i> Atención</span><span><i class="map-color-dot medium"></i> Pendiente</span><span><i class="map-color-dot low"></i> Despejado</span>
      </section>
    </section>
  </div>

  <div class="nt" id="nt"></div>
<script src="assets/js/api.js?v=20261106-map-overview-v11"></script>
  <script src="assets/js/common.js?v=20261106-grouped-notifications-v3"></script>
  <script>initCommon();</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="assets/js/mapa.js?v=20261123-compact-dedupe-v1"></script>
  <script>requestAnimationFrame(function(){ setTimeout(initMapaPage, 0); });</script>
</body>
</html>
